[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "PT"]
ignore = [
  "B008",   # FastAPI's Depends()/Query() in argument defaults
  "RUF001", "RUF002", "RUF003",  # typographic quotes and dashes in text are intended
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "PT018"]  # long literal payloads; "a and b" assertions are fine here

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["pymysql.*", "openpyxl.*"]
ignore_missing_imports = true
