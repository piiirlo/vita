<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vita</title>
    <!-- Set the theme before the first paint (no flash of the wrong theme).
         Same logic as src/theme/theme.ts; keep them in sync. -->
    <script>
      (function () {
        var pref = "system";
        try {
          var saved = localStorage.getItem("vita.theme");
          if (saved === "light" || saved === "dark" || saved === "system") pref = saved;
        } catch (e) {}
        var dark =
          pref === "dark" ||
          (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
